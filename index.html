<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0b1f3c;--mu:#64748b;--nv:#0b1f3c;--ac:#a3e635;--cy:#22d3ee;--on:#0b1f3c;--lk:#0e7490;--bd:#e2e8f0;--ok:#16a34a;--wa:#d97706;--ko:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#07142a;--card:#0e2145;--tx:#e5eaf3;--mu:#93a4c3;--on:#a3e635;--lk:#22d3ee;--bd:#1b3260}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--nv);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--ac)}
header b{font-size:16px;display:block;line-height:1.1}header button{background:rgba(255,255,255,.14);color:#fff;border:0;padding:6px 12px;border-radius:8px;margin-left:6px}
.brand{display:flex;align-items:center;gap:10px}.brand small{display:block;color:var(--ac);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.hello{margin:4px 0 12px;font-size:20px;font-weight:700}
main{max-width:980px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:24px}
h2{font-size:16px;margin:0 0 10px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px;margin-bottom:8px}
button.p{background:var(--ac);color:var(--nv);font-weight:700;border:0;padding:11px 16px;border-radius:10px;font-size:15px;width:100%}
button.s{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:6px 10px;border-radius:8px;font-size:13px}
button.ok{background:var(--ok);color:#fff;border:0;padding:7px 11px;border-radius:8px;font-size:13px}
button.ko{background:var(--ko);color:#fff;border:0;padding:7px 11px;border-radius:8px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:5}

nav button.on{color:var(--on);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{color:var(--mu)}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;color:#fff}
.t-pending{background:var(--wa)}.t-validated{background:var(--ok)}.t-rejected{background:var(--ko)}
.up{color:var(--ok)}.down{color:var(--ko)}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0b1f3c;border-left:5px solid #a3e635;color:#fff;padding:12px 16px;border-radius:12px;z-index:20;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.auth{max-width:380px;margin:8vh auto;padding:0 14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
a{color:var(--lk)}.mu{color:var(--mu)}.err{color:var(--ko);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}
.sig{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 0 4px;color:var(--mu);font-size:12px;text-align:center}
.sig b{color:var(--tx)}
.authbrand{background:var(--nv);border-radius:18px;padding:24px 16px 18px;text-align:center;margin-bottom:12px;border-bottom:4px solid var(--ac)}
.w1{color:#fff;font-weight:800;letter-spacing:6px;font-size:26px;margin-top:14px}
.w2{color:#a3e635;letter-spacing:9px;font-size:13px;margin-top:2px}
.w3{color:#8aa0c0;font-size:12px;margin-top:10px}
.cyl{width:60px;height:3px;background:#22d3ee;margin:10px auto 0;border-radius:2px}
.an rect{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
#splash{position:fixed;top:0;right:0;bottom:0;left:0;background:#0b1f3c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;transition:opacity .5s}
#splash.off{opacity:0}

.pw{position:relative}.pw input{padding-right:44px}.eye{position:absolute;right:4px;top:3px;background:none;border:0;font-size:18px;padding:8px;color:var(--mu);cursor:pointer}
.lb{display:block;font-size:13px;color:var(--mu);margin:6px 0 4px}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}.box small{display:block;color:var(--mu)}
.bd{display:inline-block;min-width:18px;padding:0 6px;border-radius:20px;background:var(--ko);color:#fff;font-size:11px;margin-left:3px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--ac);vertical-align:middle;margin-right:6px}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}
.modal>div{background:var(--card);border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.modal img{width:100%;border-radius:10px;margin:6px 0}
.tour{position:fixed;left:12px;right:12px;bottom:74px;z-index:25;max-width:420px;margin:0 auto;background:var(--nv);color:#fff;border-radius:14px;padding:12px 14px;border-left:5px solid var(--ac);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tour p{margin:0 0 8px;font-size:14px}.tour .acts{justify-content:flex-end}.tour button{border:0;border-radius:8px;padding:6px 12px}
.tour .n{background:var(--ac);color:var(--nv);font-weight:700}.tour .x{background:rgba(255,255,255,.15);color:#fff}
.hl{outline:3px solid var(--ac);outline-offset:3px;border-radius:12px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{outline-color:var(--cy)}}
.sec{margin:14px 0 6px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}label.chk input{width:auto;margin:0}

<script>
/* Navigateur trop ancien (anciens téléphones Huawei/Android) : le script principal ne peut pas se charger -> message clair. */
try { new Function('return ({}).a?.b ?? 1'); } catch (e) {

  document.body.style.background = '#0b1f3c';
  document.getElementById('app').innerHTML = '<div style="padding:28px 20px;max-width:460px;margin:auto;font:16px/1.5 sans-serif;color:#fff;text-align:center"><h2>Navigateur trop ancien</h2><p>Cette application a besoin d’un navigateur plus récent.</p><p>Installez ou mettez à jour <b>Chrome</b>, <b>Firefox</b> ou <b>Edge</b>, puis rouvrez ce lien dedans et choisissez <b>« Ajouter à l’écran d’accueil »</b>.</p></div>';
}
</script>
<script>
/* ====== CONFIGURATION Supabase ====== */
const CFG = { URL: 'https://kearpnvypzztnnltmrpp.supabase.co', KEY: 'sb_publishable_whfpzyuXH1Qup_q2h5wPdg_QY9uKqpA' };
/* ==================================== */

const sb = window.supabase.createClient(CFG.URL, CFG.KEY);
let me = null, D = {}, tab = 'home', F = { amb: '', status: '' }, authMode = 'login', charts = {}, chan = null, deferredInstall = null;
let avatarUrl = '', showUsd = false, openReq = null, pollT = null, univs = [], univLoaded = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: '2-digit' });
const mk = s => { const d = new Date(s); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const months = (n = 6) => { const a = [], d = new Date(); for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); a.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); } return a; };
const label = m => { const [y, mo] = m.split('-'); return new Date(y, mo - 1, 1).toLocaleDateString('fr-FR', { month: 'short' }); };
const stLabel = { pending: 'En attente', validated: 'Validé', rejected: 'Rejeté' };
const tag = s => `<span class="tag t-${s}">${stLabel[s]}</span>`;
const wa = p => 'https://wa.me/' + String(p || '').replace(/\D/g, '');
const usd = n => '$' + (+n || 0).toFixed(2);
const firstName = n => (String(n || '').trim().split(/\s+/)[0]) || '';
const trend = (cur, prev) => prev === 0 ? (cur > 0 ? '<span class="up">▲ nouveau</span>' : '<span class="mu">—</span>') : (cur >= prev ? `<span class="up">▲ ${Math.round((cur - prev) / prev * 100)}%</span>` : `<span class="down">▼ ${Math.round((prev - cur) / prev * 100)}%</span>`);

function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 6000); try { new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQ==').play(); } catch (e) {} }
function drawChart(id, cfg) { const el = document.getElementById(id); if (!el) return; if (charts[id]) charts[id].destroy(); charts[id] = new Chart(el, cfg); }
const errMsg = e => { const m = (e && e.message) || ''; return /Preuve requise/.test(m) ? 'La capture de la preuve de paiement est obligatoire.' : /Compte non actif/.test(m) ? 'Votre compte n\'est pas encore actif.' : /Demande introuvable/.test(m) ? 'Cette demande n\'est plus disponible.' : m || 'Une erreur est survenue.'; };

/* ---------- Mot de passe : afficher / masquer ---------- */
const pwField = (id, ph) => `<div class="pw"><input id="${id}" type="password" placeholder="${ph}" minlength="6" required autocomplete="current-password"><button type="button" class="eye" aria-label="Afficher ou masquer le mot de passe" onclick="togglePw(this)">👁</button></div>`;
function togglePw(b) { const i = b.parentNode.querySelector('input'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? '🙈' : '👁'; }

/* ---------- Images : réduction + envoi ---------- */
function shrink(file, max = 1280) {
  return createImageBitmap(file).then(bm => {
    const k = Math.min(1, max / Math.max(bm.width, bm.height)), c = document.createElement('canvas');
    c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    return new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.82));
  });
}
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
async function uploadProof(file) {
  const blob = await shrink(file), name = uuid() + '.jpg';
  const { error } = await sb.storage.from('proofs').upload(name, blob, { contentType: 'image/jpeg' });
  if (error) throw new Error('Envoi de l\'image impossible. Réessayez.');
  return CFG.URL + '/storage/v1/object/public/proofs/' + name;
}
async function signed(path) { if (!path) return ''; const { data } = await sb.storage.from('kyc').createSignedUrl(path, 900); return data ? data.signedUrl : ''; }

/* ---------- Identité Answer Digital ---------- */
const CELLS = [[2,0,'#a3e635'],[3,0,'#bef264'],[4,0,'#bef264'],[1,1,'#4ade80'],[2,1,'#a3e635'],[3,1,'#a3e635'],[4,1,'#bef264'],[1,2,'#4ade80'],[2,2,'#4ade80'],[3,2,'#a3e635'],[0,3,'#2dd4bf'],[1,3,'#2dd4bf'],[2,3,'#4ade80'],[0,4,'#22d3ee']];
const LOGO = (s = 32, anim = false) => `<svg class="${anim ? 'an' : ''}" width="${s}" height="${s}" viewBox="0 0 325 325" aria-label="Answer Digital">${CELLS.map(([c, r, f], i) => `<rect x="${c * 67}" y="${r * 67}" width="58" height="58" rx="13" fill="${f}" ${anim ? `style="animation-delay:${i * 0.06}s"` : ''}/>`).join('')}</svg>`;
const sig = () => `<div class="sig">${LOGO(18)}<span><b>Answer Digital</b> · Technology. Innovation. Solutions.</span></div>`;
$('#splash').innerHTML = `${LOGO(110, true)}<div class="w1">ANSWER</div><div class="w2">DIGITAL</div><div class="cyl"></div><div class="w3">ADG Ambassadeurs</div>`;
const shell = (title, body, navHtml = '') => `<header><div class="brand">${LOGO(34)}<div><b>ADG Ambassadeurs</b><small>by Answer Digital</small></div></div><div>${avatarUrl ? `<img class="av" src="${esc(avatarUrl)}" alt="">` : ''}${me && me.role === 'ambassador' && me.stage === 'active' ? '<button onclick="startTour()" title="Guide">?</button>' : ''}<button id="inst" onclick="installApp()" style="display:${deferredInstall || !(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) ? '' : 'none'}">Installer</button><button onclick="logout()">Déconnexion</button></div></header><main><p class="hello">${title}</p>${body}${sig()}</main>${navHtml}`;

/* ---------- AUTH ---------- */
function showAuth(err = '') {
  if (authMode === 'signup' && !univLoaded) { univLoaded = 1; sb.rpc('list_universities').then(r => { univs = r.data || []; showAuth(err); }); }
  $('#app').innerHTML = `<div class="auth"><div class="authbrand">${LOGO(84, true)}<div class="w1">ANSWER</div><div class="w2">DIGITAL</div><div class="cyl"></div><div class="w3">Technology. Innovation. Solutions.</div></div><div class="card"><h2 style="text-align:center">ADG Ambassadeurs</h2>
  <div class="tabs"><button class="s" onclick="authMode='login';showAuth()" ${authMode === 'login' ? 'style="border-color:var(--ac)"' : ''}>Connexion</button>
  <button class="s" onclick="authMode='signup';showAuth()" ${authMode === 'signup' ? 'style="border-color:var(--ac)"' : ''}>Inscription</button></div>
  <form onsubmit="doAuth(event)">
  ${authMode === 'signup' ? '<input id="fn" placeholder="Nom complet" required><input id="ph" placeholder="Téléphone (ex: +243...)" required>' + (univs.length ? '<select id="un" required><option value="">— Votre université —</option>' + univs.map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('') + '</select>' : '<p class="mu" style="font-size:13px">Chargement des universités… (si la liste reste vide, vérifiez votre connexion)</p>') : ''}
  <input id="em" type="email" placeholder="Email" required>${pwField('pw', 'Mot de passe (6+ caractères)')}
  <p class="err">${esc(err)}</p><button class="p">${authMode === 'login' ? 'Se connecter' : 'Créer mon compte'}</button></form>
  ${authMode === 'signup' ? '<p class="mu" style="font-size:13px;margin:10px 0 0">Après l\'inscription, votre compte est examiné par l\'administration avant l\'accès à votre espace.</p>' : ''}</div>${sig()}</div>`;
}
async function doAuth(e) {
  e.preventDefault();
  const email = $('#em').value.trim(), password = $('#pw').value;
  let r;
  if (authMode === 'signup' && !($('#un') && $('#un').value)) return showAuth('Choisissez votre université : elle est obligatoire pour vous inscrire.');
  if (authMode === 'signup') r = await sb.auth.signUp({ email, password, options: { data: { full_name: $('#fn').value.trim(), phone: $('#ph').value.trim(), university_id: $('#un') ? $('#un').value : '' } } });
  else r = await sb.auth.signInWithPassword({ email, password });
  if (r.error) return showAuth(/UNIVERSITE_REQUISE|Database error saving new user/i.test(r.error.message) ? 'Votre université est obligatoire pour vous inscrire.' : r.error.message);
  if (!r.data.session) return showAuth('Compte créé. Vérifiez votre email pour confirmer, puis connectez-vous.');
  boot();
}
async function logout() { clearInterval(pollT); if (chan) sb.removeChannel(chan); chan = null; await sb.auth.signOut(); me = null; avatarUrl = ''; showAuth(); }

async function boot() {
  clearInterval(pollT); if (chan) { sb.removeChannel(chan); chan = null; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showAuth();
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error || !data) return showAuth('Profil introuvable.');
  me = data; tab = 'home'; openReq = null;
  avatarUrl = me.avatar_path ? await signed(me.avatar_path) : '';
  if (me.role === 'admin') { await loadAdmin(); renderAdmin(); subAdmin(); return; }
  if (!me.active) return suspendedScreen();
  if (me.role === 'ambassador' && !me.university_id) return univGate();
  if (me.role === 'manager') { await loadMgr(); renderMgr(); subMgr(); return; }
  if (me.stage !== 'active') { renderStage(); subSelf(); return; }
  await loadAmb(); renderAmb(); subAmb();
  if (!me.welcomed) welcome();
}

/* ---------- Université obligatoire : écran bloquant pour tout ambassadeur qui n'en a pas ---------- */
async function univGate() {
  const { data } = await sb.rpc('list_universities');
  const list = data || [];
  $('#app').innerHTML = shell('Une dernière étape, ' + esc(firstName(me.full_name)), `<div class="card"><h2>🎓 Indiquez votre université</h2>
    <p>Pour continuer, vous devez indiquer l'université dont vous faites partie. Vos ventes seront rattachées au manager de cette université.</p>
    ${list.length ? `<select id="gu"><option value="">— Votre université —</option>${list.map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
    <p class="err" id="gue"></p><button class="p" onclick="saveUniv()">Confirmer mon université</button>
    <p class="mu" style="font-size:13px">Ce choix est définitif : seule l'administration pourra le modifier.</p>`
    : `<p class="err">Aucune université n'est disponible pour le moment. Contactez l'administration.</p><button class="s" onclick="boot()">Réessayer</button>`}</div>`);
}
async function saveUniv() {
  const sel = $('#gu'), er = $('#gue'); er.textContent = '';
  if (!sel.value) { er.textContent = 'Choisissez votre université.'; return; }
  if (!confirm('Confirmer « ' + sel.selectedOptions[0].text + ' » ? Ce choix est définitif : seule l\'administration pourra le modifier.')) return;
  const { error } = await sb.rpc('set_my_university', { p_univ: sel.value });
  if (error) { er.textContent = errMsg(error); return; }
  toast('Université enregistrée'); boot();
}

/* ================= INSCRIPTION AMBASSADEUR : étapes ================= */
function subSelf() {
  chan = sb.channel('self-' + me.id).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${me.id}` }, () => boot()).subscribe();
  pollT = setInterval(async () => { const { data } = await sb.from('profiles').select('stage').eq('id', me.id).single(); if (data && data.stage !== me.stage) boot(); }, 20000);
}
function renderStage() {
  const s = me.stage, n = esc(firstName(me.full_name));
  let body = '';
  if (s === 'pending') body = `<div class="card"><h2>⏳ Inscription reçue</h2><p>Merci ${n} ! L'administration examine votre inscription <b>(étape 1 sur 2)</b>. Vous serez prévenu automatiquement : cet écran s'actualisera tout seul.</p><button class="s" onclick="boot()">Vérifier maintenant</button></div>`;
  if (s === 'kyc') body = `<div class="card"><h2>✅ Étape 1 validée — complétez votre dossier</h2><p class="mu">Ces informations restent privées et servent uniquement à vérifier votre identité et à vous verser vos gains.</p>
    <form onsubmit="doKyc(event)"><span class="lb">Photo de profil (visage visible)</span><input id="kf1" type="file" accept="image/*" required>
    <span class="lb">Capture ou photo de votre pièce d'identité (bien visible)</span><input id="kf2" type="file" accept="image/*" required>
    <span class="lb">Réseau mobile money</span><select id="kn"><option>Airtel Money</option><option>Orange Money</option><option>M-Pesa</option><option>Africell Money</option><option>Autre</option></select>
    <input id="km" type="tel" placeholder="Numéro mobile money (ex: 0999...)" required><p class="err" id="ke"></p><button class="p" id="kb">Envoyer mon dossier</button></form></div>`;
  if (s === 'review') body = `<div class="card"><h2>🔎 Dossier en cours de vérification</h2><p>Merci ${n}. L'administration vérifie votre dossier <b>(étape 2 sur 2)</b>. Dès validation, votre espace ambassadeur s'ouvrira automatiquement.</p><button class="s" onclick="boot()">Vérifier maintenant</button></div>`;
  $('#app').innerHTML = shell('Bienvenue ' + n, body);
}
async function doKyc(e) {
  e.preventDefault();
  const b = $('#kb'), er = $('#ke'); b.disabled = true; b.textContent = 'Envoi en cours…'; er.textContent = '';
  try {
    const up = async (id, name) => { const blob = await shrink($(id).files[0]); const path = me.id + '/' + name + '.jpg'; const { error } = await sb.storage.from('kyc').upload(path, blob, { contentType: 'image/jpeg', upsert: true }); if (error) throw new Error('Envoi d\'une image impossible. Réessayez.'); return path; };

/* ---------- Message de bienvenue + guide ---------- */
const TOUR = [
  ['#codeCard', 'Voici votre code ambassadeur. Donnez-le à vos clients : ils vous choisiront dans l\'application achetée.'],
  ['nav [data-t=reqs]', 'Demandes : quand un client vous choisit, son formulaire arrive ici. Vous le remplissez, l\'administration valide.'],
  ['nav [data-t=clients]', 'Clients : suivez chaque client et son statut (en attente, validé).'],

let tourI = -1;
function welcome() {
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'wm';
  m.innerHTML = `<div style="text-align:center">${LOGO(64, true)}<h2 style="margin-top:10px">🎉 Bienvenue dans l'équipe, ${esc(firstName(me.full_name))} !</h2><p>Votre compte ambassadeur est actif. Votre code :</p><p style="font-size:24px;font-weight:800;letter-spacing:1px;margin:4px 0">${esc(me.referral_code)}</p><p class="mu">Chaque client validé vous rapporte des points, convertibles en dollars.</p><button class="p" onclick="$('#wm').remove();startTour()">Découvrir l'application</button><button class="s" style="margin-top:8px" onclick="$('#wm').remove();endTour()">Plus tard</button></div>`;
  document.body.appendChild(m);
}
function startTour() { tab = 'home'; renderAmb(); tourI = 0; showTour(); }
function showTour() {
  document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); const old = $('#tour'); if (old) old.remove();
  while (tourI < TOUR.length && !$(TOUR[tourI][0])) tourI++;
  if (tourI >= TOUR.length) return endTour();
  const [sel, txt] = TOUR[tourI], el = $(sel); el.classList.add('hl'); try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
  const t = document.createElement('div'); t.className = 'tour'; t.id = 'tour';
  t.innerHTML = `<p>${txt}</p><div class="acts"><button class="x" onclick="endTour()">Passer</button><button class="n" onclick="tourI++;showTour()">${tourI >= TOUR.length - 1 ? 'Terminer' : 'Suivant'}</button></div>`;
  document.body.appendChild(t);
}
function endTour() {
  document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); const t = $('#tour'); if (t) t.remove(); tourI = -1;
  if (me && !me.welcomed) { me.welcomed = true; sb.rpc('mark_welcomed'); }
}

async function sendReq(e, id) {
  e.preventDefault();
  const b = $('#rs'), er = $('#re'), method = $('#rm').value, f = $('#rf').files[0];

  b.disabled = true; b.textContent = 'Envoi en cours…';
  try {
    const proof = method === 'mobile_money' ? await uploadProof(f) : null;
    const { error } = await sb.rpc('submit_request_form', { p_request: id, p_name: $('#rn').value, p_phone: $('#rp').value, p_method: method, p_proof_url: proof, p_note: $('#rt').value });
    if (error) throw error;
    toast('Formulaire envoyé : en attente de validation de l\'administration');
    openReq = null; await loadAmb(); renderAmb();
  } catch (x) { er.textContent = errMsg(x); b.disabled = false; b.textContent = 'Envoyer à l\'administration'; }

async function declineReq(id) {

}

async function setStatus(id, status) {
  if (status === 'validated' && !confirm('Confirmer : paiement reçu ? L\'application sera débloquée et les points crédités à l\'ambassadeur.')) return;
  const { error } = await sb.from('sales').update({ status }).eq('id', id);
  if (error) return alert(error.message);
  toast(status === 'validated' ? 'Validé — le client est débloqué, l\'ambassadeur est notifié' : 'Rejeté');
  await loadAdmin(); renderAdmin();
}
async function toggleAmb(id, active) { await sb.from('profiles').update({ active }).eq('id', id); await loadAdmin(); renderAdmin(); }
async function mgrActiveAny(id, flag) { if (!flag && !confirm('Suspendre ce compte ?')) return; const { error } = await sb.rpc('mgr_set_active', { p_user: id, p_active: flag }); if (error) { await sb.from('profiles').update({ active: flag }).eq('id', id); } await refresh(); }
async function setStage(id, stage) {
  const { error } = await sb.rpc('mgr_set_stage', { p_user: id, p_stage: stage });
  if (error) return alert(error.message);
  toast(stage === 'kyc' ? 'Étape 1 validée : l\'ambassadeur peut envoyer son dossier' : stage === 'active' ? 'Ambassadeur activé 🎉' : 'Mis à jour');
  closeModal(); await refresh();
}
async function delAmb(id, name) {
  if (!confirm('Supprimer définitivement le compte de ' + name + ' ?\nSes points et notifications seront supprimés. Ses ventes restent enregistrées sans ambassadeur.')) return;
  const { error } = await sb.rpc('admin_delete_user', { p_user: id });
  if (error) return alert(error.message);
  toast('Compte supprimé'); closeModal(); await refresh();
}
function closeModal() { const m = $('#km2'); if (m) m.remove(); }

/* ================= MANAGER / CHEF / ÉQUIPES ================= */
async function refresh() { if (me.role === 'admin') { await loadAdmin(); renderAdmin(); } else if (me.role === 'manager') { await loadMgr(); renderMgr(); } else { await loadAmb(); renderAmb(); } }
const typing = () => document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
const sameDay = d => new Date(d).toDateString() === new Date().toDateString();
const sum = (l, k) => l.reduce((a, x) => a + (+x[k] || 0), 0);
const stageTxt = { pending: 'Inscription à valider', kyc: 'Dossier à envoyer', review: 'Dossier à vérifier', active: 'Actif' };

function suspendedScreen() {
  $('#app').innerHTML = shell('Compte suspendu', `<div class="card"><h2>⛔ Votre compte est suspendu</h2><p>Contactez votre manager ou l'administration pour plus d'informations.</p></div>`);
}

function memberStats(a, sales, led) {
  const mine = sales.filter(s => s.ambassador_id === a.id), v = mine.filter(s => s.status === 'validated'), pts = led.filter(l => l.ambassador_id === a.id);
  return { total: v.length, pending: mine.filter(s => s.status === 'pending').length, points: sum(pts, 'points'), usd: sum(pts, 'usd'), today: v.filter(s => sameDay(s.validated_at || s.created_at)).length, todayPts: sum(pts.filter(l => sameDay(l.created_at)), 'points') };
}
function teamList(members, sales, led, mode) {
  if (!members.length) return '<p class="mu">Aucun ambassadeur dans l\'équipe pour le moment.</p>';
  return members.map(a => {
    const s = memberStats(a, sales, led); let acts = '';
    if (mode === 'mgr') {
      if (a.stage === 'pending') acts += `<button class="ok" onclick="setStage('${a.id}','kyc')">✔ Valider</button>`;
      if (a.stage === 'review') acts += `<button class="s" onclick="viewKyc('${a.id}')">Voir le dossier</button>`;
      if (a.stage === 'active') acts += `<button class="s" onclick="mgrChief('${a.id}',${!a.is_chief})">${a.is_chief ? 'Retirer « en chef »' : '👑 Nommer en chef'}</button>`;
      if (a.stage === 'active') acts += `<button class="${a.active ? 'ko' : 'ok'}" onclick="mgrActive('${a.id}',${!a.active})">${a.active ? 'Suspendre' : 'Réactiver'}</button>`;
    }
    return `<div class="row" style="align-items:flex-start"><div><b>${esc(a.full_name)}</b> ${a.is_chief ? '👑' : ''} ${a.active ? '' : '<span class="tag t-rejected">Suspendu</span>'}<br>
      <small>${esc(a.referral_code)} · ${stageTxt[a.stage] || ''} · <a href="${wa(a.phone)}" target="_blank">${esc(a.phone)}</a></small><br>
      <small>Validés : <b>${s.total}</b> · En attente : ${s.pending} · Aujourd'hui : <b>${s.today}</b> · ${showUsd ? usd(s.usd) : s.points + ' pts'}</small>${acts ? `<div class="acts">${acts}</div>` : ''}</div></div>`;
  }).join('');
}
const broadcastCard = () => `<div class="card"><h2>📣 Message à l'équipe</h2><textarea id="bm" rows="2" maxlength="300" placeholder="Un mot pour motiver l'équipe…"></textarea><button class="p" onclick="sendBroadcast()">Envoyer à toute l'équipe</button></div>`;

async function mgrChief(id, flag) { const { error } = await sb.rpc('mgr_set_chief', { p_user: id, p_flag: flag }); if (error) return alert(error.message); toast(flag ? '👑 Ambassadeur en chef nommé' : 'Rôle retiré'); await refresh(); }

/* ---------- Compte MANAGER ---------- */
async function loadMgr() {
  const [team, sales, led, mled, apps, un, nt] = await Promise.all([
    sb.from('profiles').select('*').eq('role', 'ambassador').order('created_at'),
    sb.from('sales').select('*, apps(name), profiles(full_name, referral_code)').order('created_at', { ascending: false }),
    sb.from('points_ledger').select('*'),
    sb.from('manager_ledger').select('*, sales(client_name, apps(name)), profiles:ambassador_id(full_name)').eq('manager_id', me.id).order('created_at', { ascending: false }),
    sb.from('apps').select('*').eq('active', true),
    sb.from('universities').select('*'),
    sb.from('notifications').select('*').eq('ambassador_id', me.id).order('created_at', { ascending: false }).limit(20)
  ]);
  D = { notifs: nt.data || [], ambs: team.data || [], sales: sales.data || [], led: led.data || [], mled: mled.data || [], apps: apps.data || [], univ: (un.data || []).find(u => u.id === me.university_id) };
}
function subMgr() {
  const soft = async () => { await loadMgr(); if (!typing()) renderMgr(); };
  chan = sb.channel('mgr-' + me.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, async p => {
      if (p.eventType === 'INSERT' && p.new.university_id === me.university_id) toast('🆕 Nouvelle inscription dans votre équipe');
      if (p.eventType === 'UPDATE' && p.new.university_id === me.university_id && p.new.stage === 'review' && p.old.stage !== 'review') toast('🔎 Dossier à vérifier');
      await soft();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sales' }, soft)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `ambassador_id=eq.${me.id}` }, async p => { toast('🎉 ' + p.new.message); await soft(); })
    .subscribe();
}

/* ---------- Dettes, paiements et objectifs ---------- */
const debtLeft = d => (+d.amount_usd || 0) - (+d.repaid_usd || 0);
const unpaid = l => (l || []).filter(x => !x.payment_id);
const r2 = n => Math.round((+n || 0) * 100) / 100;
const todayK = () => new Date(Date.now() + 3600000).toISOString().slice(0, 10); /* jour de Kinshasa (UTC+1) */
const addDays = (k, n) => { const d = new Date(k + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fmtK = k => new Date(k + 'T12:00:00Z').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', timeZone: 'UTC' });
const pct = (r, t) => t > 0 ? Math.round(r / t * 100) : 0;
const bar = p => `<div style="background:var(--bd);border-radius:8px;height:10px;margin:6px 0"><div style="width:${Math.min(100, p)}%;height:10px;border-radius:8px;background:${p >= 100 ? 'var(--ok)' : 'var(--ac)'}"></div></div>`;
const kindTxt = { day: 'du jour', '3days': 'sur 3 jours', week: 'sur la semaine' };

function myDebtsHtml(debts) {

}
const debtWarn = debts => { const t = (debts || []).filter(d => d.status === 'open').reduce((a, d) => a + debtLeft(d), 0); return t > 0 ? `<div class="card" style="border-color:var(--wa)"><b>💳 Dette en cours : <span class="down">${usd(t)}</span></b><br><small class="mu">Déduite automatiquement de votre prochain paiement. Détail dans l'onglet « Points ».</small></div>` : ''; };

const payArchiveHtml = pays => `<div class="card"><h2>🧾 Archive de mes paiements</h2><p class="mu" style="margin:0 0 6px"><small>Archive définitive : elle ne peut être ni modifiée ni supprimée.</small></p>${(pays || []).length ? payRows(pays) : '<p class="mu">Aucun paiement pour le moment.</p>'}</div>`;

async function loadTeamGoals() {
  const from = addDays(todayK(), -29);
  const [m, t, p] = await Promise.all([sb.rpc('team_members'), sb.rpc('team_targets', { p_from: from }), sb.rpc('team_progress', { p_from: from })]);
  return { members: m.data || [], targets: t.data || [], prog: p.data || [] };
}
function dayRows(targets, prog, n) {
  const t = todayK(), out = [];
  for (let i = 0; i < n; i++) {
    const k = addDays(t, -i), tg = targets.find(x => x.kind === 'day' && x.start_date === k), pr = prog.find(x => x.day === k);
    out.push({ k, target: tg ? tg.target : 0, reached: pr ? pr.reached : 0 });
  }
  return out;
}
const periodReached = (prog, tg) => { const t = todayK(), to = tg.end_date < t ? tg.end_date : t; return prog.filter(x => x.day >= tg.start_date && x.day <= to).reduce((a, x) => a + x.reached, 0); };
const activeTg = (targets, kind) => { const t = todayK(); return targets.find(x => x.kind === kind && x.start_date <= t && x.end_date >= t); };
const tgCell = (targets, prog, kind) => { const g = activeTg(targets, kind); return g ? periodReached(prog, g) + ' / ' + g.target : '<span class="mu">—</span>'; };

/* Vue équipe (manager, ambassadeur en chef, administration) */

  return `<div class="grid"><div class="kpi"><small>Objectif du jour (équipe)</small><b>${tot.t}</b></div><div class="kpi"><small>Atteints aujourd'hui</small><b>${tot.r}</b> <small>${pct(tot.r, tot.t)}%</small></div><div class="kpi"><small>Ont fixé leur objectif</small><b>${tot.n}/${mem.length}</b></div></div>
  <div class="card" style="margin-top:12px"><h2>🎯 Aujourd'hui — ${fmtK(t)}</h2><div style="overflow-x:auto"><table><tr><th>Ambassadeur</th>${univs ? '<th>Univ.</th>' : ''}<th>Jour</th><th>3 jours</th><th>Semaine</th><th>7 j</th></tr>
  ${rows.map(r => `<tr><td>${esc(r.m.full_name)} ${r.m.is_chief ? '👑' : ''}</td>${univs ? '<td><small>' + un(r.m) + '</small></td>' : ''}<td>${r.today.target ? `<b>${r.today.reached} / ${r.today.target}</b> <small class="${pct(r.today.reached, r.today.target) >= 100 ? 'up' : 'mu'}">${pct(r.today.reached, r.today.target)}%</small>` : '<span class="down">non fixé</span>'}</td><td>${tgCell(r.tg, r.pr, '3days')}</td><td>${tgCell(r.tg, r.pr, 'week')}</td><td>${r.w1} ${trend(r.w1, r.w0)}</td></tr>`).join('')}</table></div></div>

}
function drawTeamGoals(T) {

/* ---------- Admin : paie, dettes, archive ---------- */
function payPeople() {
  const people = D.mgrs.map(m => ({ p: m, role: 'manager' })).concat(D.ambs.filter(a => a.stage === 'active').map(a => ({ p: a, role: 'ambassador' })));
  return people.map(({ p, role }) => {
    const L = unpaid(role === 'manager' ? D.mled.filter(l => l.manager_id === p.id) : D.led.filter(l => l.ambassador_id === p.id));
    const pts = sum(L, 'points'), gross = r2(sum(L, 'usd')), debt = r2(D.debts.filter(d => d.person_id === p.id && d.status === 'open').reduce((a, d) => a + debtLeft(d), 0)), ded = Math.min(gross, debt);
    return { p, role, pts, gross, debt, ded, net: r2(gross - ded) };
  });
}

    <small>Gains non payés : <b>${x.pts} pts · ${usd(x.gross)}</b>${x.debt > 0 ? ` · Dettes : <b class="down">${usd(x.debt)}</b> (déduit : ${usd(x.ded)})` : ''}</small><br><b>Net à payer : ${usd(x.net)}</b>
    <div class="acts">${x.pts > 0 || x.gross > 0 ? `<button class="ok" onclick="payModal('${x.p.id}')">💰 Marquer payé</button>` : ''}<button class="s" onclick="debtModal('${x.p.id}')">➕ Dette</button></div></div></div>`).join('') || '<p class="mu">Personne à payer pour le moment : tous les compteurs sont à zéro.</p>'}</div>
  <div class="sec">Dettes ouvertes (${openD.length})</div><div class="card">${openD.map(d => `<div class="row" style="align-items:flex-start"><div><b>${esc(nm(d.person_id))}</b> · <b class="down">${usd(debtLeft(d))}</b> <small class="mu">sur ${usd(d.amount_usd)}</small><br><small>${esc(d.reason || 'Dette')} · ${fmtD(d.created_at)}</small><div class="acts"><button class="s" onclick="repayDebt('${d.id}',${debtLeft(d)})">Remboursement reçu</button><button class="ko" onclick="cancelDebt('${d.id}')">Annuler</button></div></div></div>`).join('') || '<p class="mu">Aucune dette ouverte.</p>'}</div>
  <div class="sec">Archive des paiements (définitive)</div><div class="card"><select onchange="F.pp=this.value;renderAdmin()"><option value="">Toutes les personnes</option>${names.map(n => `<option ${F.pp === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
  <p class="mu" style="margin:4px 0"><small>Aucune ligne ne peut être modifiée ni supprimée.${F.pp ? ' Total net payé à ' + esc(F.pp) + ' : <b>' + usd(sum(arch, 'net_usd')) + '</b>' : ''}</small></p>${arch.length ? payRows(arch, true) : '<p class="mu">Aucun paiement enregistré.</p>'}</div>`;
}
function openModal(html) { closeModal(); const m = document.createElement('div'); m.className = 'modal'; m.id = 'km2'; m.innerHTML = '<div>' + html + '</div>'; document.body.appendChild(m); }
function payModal(id) {
  const x = payPeople().find(y => y.p.id === id); if (!x) return;
  let avail = x.gross; const dl = D.debts.filter(d => d.person_id === id && d.status === 'open').sort((a, b) => a.created_at < b.created_at ? -1 : 1).map(d => { const t = r2(Math.min(avail, debtLeft(d))); avail = r2(avail - t); return { d, t }; }).filter(z => z.t > 0);
  openModal(`<h2>💰 Payer ${esc(x.p.full_name)}</h2><p class="mu">${x.role === 'manager' ? 'Manager' : 'Ambassadeur'} · ${esc(x.p.momo_network || '')} ${esc(x.p.momo_number || 'numéro non renseigné')}</p>
    <div class="box"><small>Gains non payés</small><b>${x.pts} pts · ${usd(x.gross)}</b></div>
    ${dl.length ? `<div class="box"><small>Dettes déduites automatiquement</small>${dl.map(z => `<b class="down">−${usd(z.t)}</b> <small>${esc(z.d.reason || 'Dette')}${debtLeft(z.d) > z.t ? ' (reste ' + usd(r2(debtLeft(z.d) - z.t)) + ')' : ' (soldée)'}</small><br>`).join('')}</div>` : ''}
    <div class="box"><small>Montant à payer maintenant</small><b style="font-size:26px">${usd(x.net)}</b></div>
    <span class="lb">Moyen de paiement</span><select id="pyM"><option>Mobile money</option><option>Cash</option><option>Autre</option></select>
    <span class="lb">Référence / note (optionnel)</span><input id="pyR" maxlength="120" placeholder="N° de transaction…">
    <p class="mu"><small>⚠️ Action définitive : le paiement est archivé sans possibilité de modification et le compteur repart à zéro.</small></p>
    <button class="p" onclick="doPay('${id}',${x.gross})">✔ Confirmer : j'ai payé ${usd(x.net)}</button><button class="s" style="width:100%;margin-top:8px" onclick="closeModal()">Annuler</button>`);
}
async function doPay(id, expected) {
  const { error } = await sb.rpc('admin_pay', { p_user: id, p_method: $('#pyM').value, p_reference: $('#pyR').value.trim(), p_expected: expected });
  if (error) return alert(error.message);
  closeModal(); toast('💰 Paiement archivé — compteur remis à zéro'); await refresh();
}
function debtModal(id) {
  const a = D.ambs.concat(D.mgrs).find(x => x.id === id); if (!a) return;
  openModal(`<h2>➕ Dette de ${esc(a.full_name)}</h2><form onsubmit="doDebt(event,'${id}')"><span class="lb">Montant de la dette ($)</span><input id="dbA" type="number" step="0.01" min="0.01" required><span class="lb">Motif</span><input id="dbR" maxlength="300" placeholder="Ex. avance, matériel…" required>
    <p class="mu"><small>Elle sera visible par la personne et déduite automatiquement de son prochain paiement.</small></p><button class="p">Enregistrer la dette</button><button type="button" class="s" style="width:100%;margin-top:8px" onclick="closeModal()">Annuler</button></form>`);
}
async function doDebt(e, id) {
  e.preventDefault(); const { error } = await sb.rpc('admin_add_debt', { p_user: id, p_amount: parseFloat($('#dbA').value), p_reason: $('#dbR').value.trim() });
  if (error) return alert(error.message); closeModal(); toast('Dette enregistrée'); await refresh();
}
async function repayDebt(id, left) {
  const v = prompt('Montant remboursé par la personne ($) — maximum ' + usd(left), left); if (v === null) return;
  const { error } = await sb.rpc('admin_repay_debt', { p_id: id, p_amount: parseFloat(String(v).replace(',', '.')) }); if (error) return alert(error.message); toast('Remboursement enregistré'); await refresh();
}
async function cancelDebt(id) { if (!confirm('Annuler cette dette ? Le reste dû sera effacé.')) return; const { error } = await sb.rpc('admin_cancel_debt', { p_id: id }); if (error) return alert(error.message); toast('Dette annulée'); await refresh(); }

/* ---------- Admin : universités, managers ---------- */
async function addUniv(e) { e.preventDefault(); const { error } = await sb.from('universities').insert({ name: $('#un1').value.trim() }); if (error) return alert(error.message); toast('Université ajoutée'); await refresh(); }
async function toggleUniv(id, active) { await sb.from('universities').update({ active }).eq('id', id); await refresh(); }
async function setMgr(uid) {
  const u = $('#mp-' + uid).value; if (!u) return alert('Choisissez la personne à nommer.');
  const { error } = await sb.rpc('admin_set_role', { p_user: u, p_role: 'manager', p_univ: uid });
  if (error) return alert(/duplicate|unique/i.test(error.message) ? 'Cette université a déjà un manager.' : error.message);
  toast('Manager nommé'); await refresh();
}
async function unsetMgr(id) { if (!confirm('Retirer le rôle de manager ?')) return; const { error } = await sb.rpc('admin_set_role', { p_user: id, p_role: 'ambassador', p_univ: null }); if (error) return alert(error.message); await refresh(); }
async function setUniv(id, v) { const { error } = await sb.rpc('admin_set_university', { p_user: id, p_univ: v || null }); if (error) return alert(error.message); toast('Université mise à jour'); await refresh(); }

async function installApp() { if (!deferredInstall) return alert('Pour installer l’application : ouvrez le menu du navigateur (⋮ ou ☰), puis « Ajouter à l’écran d’accueil » (sur Huawei : « Ajouter à » puis « Écran d’accueil »). Si l’option n’existe pas ou si l’affichage est déformé, ouvrez ce lien dans Chrome, Firefox ou Edge.'); deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; const b = $('#inst'); if (b) b.style.display = 'none'; }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b = $('#inst'); if (b) b.style.display = ''; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot().finally(() => setTimeout(() => { const s = $('#splash'); if (s) { s.classList.add('off'); setTimeout(() => s.remove(), 500); } }, 900));
</script>
</body>
</html>
